services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langops-website-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app           # Bind mount: Syncs local project files into the container
      - /app/node_modules # Anonymous volume: Prevents host node_modules from overwriting container node_modules
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=1000
      - CHOKIDAR_USEPOLLING=true
      - NEXT_TURBOPACK_POLLING=true
      - BASEPATH=${BASEPATH}
      - TrelloKey=${TrelloKey}
      - TrelloToken=${TrelloToken}
      - TrelloBoardId=${TrelloBoardId}
      - TrelloSecret=${TrelloSecret}
      - crowdinToken=${crowdinToken}
      - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID}
      - CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET}

    
    networks:
      - shared-network


networks:
  shared-network:
    external: true
    name: dev-bridge-network